<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的第一个 GitHub 页面</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #111827, #312e81);
      color: white;
    }
    .card {
      width: min(92vw, 720px);
      padding: 48px;
      border-radius: 28px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 24px 70px rgba(0,0,0,.35);
      backdrop-filter: blur(14px);
    }
    h1 { margin: 0 0 14px; font-size: clamp(36px, 7vw, 64px); }
    p { font-size: 18px; line-height: 1.7; opacity: .9; }
    button {
      margin-top: 18px;
      border: 0;
      border-radius: 999px;
      padding: 13px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #msg { margin-top: 16px; font-weight: 700; }
  </style>
</head>
<body>
  <main class="card">
    <h1>你好，GitHub 👋</h1>
    <p>这是我的第一个 GitHub 小网页。它是由 ChatGPT 直接写进我的仓库里的。</p>
    <button id="btn">点我试试</button>
    <div id="msg"></div>
  </main>
  <script>
    document.getElementById('btn').addEventListener('click', () => {
      document.getElementById('msg').textContent = '成功！这个网页里的 JavaScript 也在运行。';
    });
  </script>
</body>
</html>
